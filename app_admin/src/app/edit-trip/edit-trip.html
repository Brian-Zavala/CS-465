<div class="col-md-6 offset-md-3 mt-4">
    <h2 class="text-center mb-4">Edit Trip: {{ f['name'].value }}</h2>
    <form [formGroup]="editForm" (ngSubmit)="onSubmit()">
        <div class="mb-3">
            <label class="form-label">Trip Code:</label>
            <input type="text" formControlName="code" class="form-control" [ngClass]="{ 'is-invalid': submitted && f['code'].errors }">
            <div *ngIf="submitted && f['code'].errors" class="invalid-feedback">
                <div *ngIf="f['code'].errors['required']">Trip Code is required</div>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Name:</label>
            <input type="text" formControlName="name" class="form-control" [ngClass]="{ 'is-invalid': submitted && f['name'].errors }">
            <div *ngIf="submitted && f['name'].errors" class="invalid-feedback">
                <div *ngIf="f['name'].errors['required']">Name is required</div>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Length:</label>
            <input type="text" formControlName="length" class="form-control" [ngClass]="{ 'is-invalid': submitted && f['length'].errors }">
            <div *ngIf="submitted && f['length'].errors" class="invalid-feedback">
                <div *ngIf="f['length'].errors['required']">Length is required</div>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Start Date:</label>
            <input type="date" formControlName="start" class="form-control" [ngClass]="{ 'is-invalid': submitted && f['start'].errors }">
            <div *ngIf="submitted && f['start'].errors" class="invalid-feedback">
                <div *ngIf="f['start'].errors['required']">Start Date is required</div>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Resort:</label>
            <input type="text" formControlName="resort" class="form-control" [ngClass]="{ 'is-invalid': submitted && f['resort'].errors }">
            <div *ngIf="submitted && f['resort'].errors" class="invalid-feedback">
                <div *ngIf="f['resort'].errors['required']">Resort is required</div>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Per Person:</label>
            <input type="text" formControlName="perPerson" class="form-control" [ngClass]="{ 'is-invalid': submitted && f['perPerson'].errors }">
            <div *ngIf="submitted && f['perPerson'].errors" class="invalid-feedback">
                <div *ngIf="f['perPerson'].errors['required']">Per Person is required</div>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Image Filename:</label>
            <input type="text" formControlName="image" class="form-control" [ngClass]="{ 'is-invalid': submitted && f['image'].errors }">
            <div *ngIf="submitted && f['image'].errors" class="invalid-feedback">
                <div *ngIf="f['image'].errors['required']">Image Filename is required</div>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Description:</label>
            <textarea formControlName="description" class="form-control" rows="3" [ngClass]="{ 'is-invalid': submitted && f['description'].errors }"></textarea>
            <div *ngIf="submitted && f['description'].errors" class="invalid-feedback">
                <div *ngIf="f['description'].errors['required']">Description is required</div>
            </div>
        </div>

        <div class="d-grid gap-2 d-md-block text-center mt-4 mb-5">
            <button class="btn btn-primary px-4 me-md-2" type="submit">Save Changes</button>
            <button class="btn btn-secondary px-4" type="button" (click)="onCancel()">Cancel</button>
        </div>
    </form>
</div>
