<div class="row">
  <div class="col-12 col-md-8">
    <h3>Login</h3>
    <form (submit)="onLoginSubmit()" method="post" role="form">
      <div *ngIf="formError" class="alert alert-danger" role="alert">{{ formError }}</div>
      <div class="form-group row">
        <label for="email" class="col-12 col-sm-2 col-form-label text-sm-right">Email</label>
        <div class="col-12 col-sm-10">
          <input type="email" class="form-control" id="email" name="email" placeholder="Enter email" [(ngModel)]="credentials.email">
        </div>
      </div>
      <div class="form-group row">
        <label for="password" class="col-12 col-sm-2 col-form-label text-sm-right">Password</label>
        <div class="col-12 col-sm-10">
          <input type="password" class="form-control" id="password" name="password" placeholder="Enter password" [(ngModel)]="credentials.password">
        </div>
      </div>
      <button type="submit" class="btn btn-primary float-right">Login!</button>
    </form>
  </div>
</div>
